<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Мини-приложение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #7d8b99);
    --card: var(--tg-theme-secondary-bg-color, #232e3c);
    --btn: var(--tg-theme-button-color, #5288c1);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 16px 90px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--hint); margin: 0 0 20px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--card); border-radius: 14px; padding: 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .emoji { font-size: 36px; text-align: center; }
  .name { font-weight: 600; }
  .price { color: var(--hint); font-size: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .qty { display: flex; align-items: center; gap: 10px; }
  .qty button {
    width: 30px; height: 30px; border-radius: 50%; border: 0;
    background: var(--btn); color: var(--btn-text); font-size: 18px; cursor: pointer;
  }
  .qty span { min-width: 16px; text-align: center; }
  .info { margin-top: 20px; background: var(--card); border-radius: 14px; padding: 14px; font-size: 14px; }
  /* Запасная кнопка для открытия вне Telegram */
  #fallback {
    position: fixed; left: 16px; right: 16px; bottom: 16px; display: none;
    padding: 14px; border: 0; border-radius: 12px;
    background: var(--btn); color: var(--btn-text); font-size: 16px; cursor: pointer;
  }
</style>
</head>
<body>
  <h1 id="hello">Привет!</h1>
  <p class="sub">Это пример Telegram Mini App. Выбери что-нибудь:</p>

  <div class="grid" id="grid"></div>

  <div class="info" id="info"></div>

  <button id="fallback">Оформить</button>

<script>
  const tg = window.Telegram?.WebApp;
  const inTelegram = !!(tg && tg.initData);

  const items = [
    { id: 1, emoji: "☕", name: "Кофе",     price: 150 },
    { id: 2, emoji: "🥐", name: "Круассан", price: 120 },
    { id: 3, emoji: "🍰", name: "Торт",     price: 250 },
    { id: 4, emoji: "🧋", name: "Чай",      price: 100 },
  ];
  const cart = {};

  if (tg) {
    tg.ready();
    tg.expand();                       // раскрыть на всю высоту
    const user = tg.initDataUnsafe?.user;
    if (user) document.getElementById("hello").textContent = "Привет, " + user.first_name + "!";
    document.getElementById("info").innerHTML =
      "Платформа: <b>" + tg.platform + "</b><br>Тема: <b>" + tg.colorScheme + "</b>";
    tg.MainButton.setText("Оформить заказ");
    tg.MainButton.onClick(checkout);
  }

  const grid = document.getElementById("grid");
  items.forEach(it => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="emoji">${it.emoji}</div>
      <div class="name">${it.name}</div>
      <div class="price">${it.price} ₽</div>
      <div class="row">
        <div class="qty">
          <button data-d="-1">−</button><span id="q${it.id}">0</span><button data-d="1">+</button>
        </div>
      </div>`;
    el.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => change(it.id, +b.dataset.d)));
    grid.appendChild(el);
  });

  function change(id, d) {
    cart[id] = Math.max(0, (cart[id] || 0) + d);
    document.getElementById("q" + id).textContent = cart[id];
    tg?.HapticFeedback?.impactOccurred("light");
    updateButton();
  }

  function total() {
    return items.reduce((s, it) => s + (cart[it.id] || 0) * it.price, 0);
  }

  function updateButton() {
    const t = total();
    const text = t ? "Оформить заказ · " + t + " ₽" : "";
    if (tg) {
      if (t) { tg.MainButton.setText(text); tg.MainButton.show(); }
      else tg.MainButton.hide();
    }
    const fb = document.getElementById("fallback");
    fb.style.display = (!inTelegram && t) ? "block" : "none";
    fb.textContent = text;
  }

  function checkout() {
    const order = items.filter(it => cart[it.id]).map(it => ({ id: it.id, qty: cart[it.id] }));
    if (inTelegram) {
      tg.sendData(JSON.stringify({ order, total: total() })); // уйдёт боту и закроет приложение
    } else {
      alert("Заказ: " + JSON.stringify(order) + "\nИтого: " + total() + " ₽");
    }
  }
  document.getElementById("fallback").addEventListener("click", checkout);
</script>
</body>
</html>
